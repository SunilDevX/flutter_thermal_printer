name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-example:
    name: build (${{ matrix.target }})
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: web-wasm
            os: ubuntu-latest
            command: flutter build web --wasm
          - target: ios
            os: macos-latest
            command: flutter build ios --simulator --debug
          - target: macos
            os: macos-latest
            command: flutter build macos --debug
          - target: windows
            os: windows-latest
            command: flutter build windows --debug
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ${{ matrix.command }}
